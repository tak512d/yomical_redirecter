<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>よみカレ 停止</title>
    <script>
        window.onload = function() {
            // Android Intent経由でカスタムスキームを起動
            var intentUrl = "intent://stop#Intent;scheme=yomical;package=dev.tak512d.readcalendar;end";
            window.location.href = intentUrl;
        };
    </script>
</head>
<body>
    <p>よみカレを停止しています...</p>
    <a href="intent://stop#Intent;scheme=yomical;package=dev.tak512d.readcalendar;end">手動で停止する</a>
</body>
</html>
